# Run with: mvn spring-boot:run -Dspring-boot.run.profiles=h2
# In-memory database for trying the app without MySQL. Data is lost on restart.
spring.datasource.url=jdbc:h2:mem:resq;MODE=MySQL;NON_KEYWORDS=YEAR,DATE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
