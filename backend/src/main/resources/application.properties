spring.application.name=resq-campus
server.port=8080
server.error.include-stacktrace=never
server.error.include-message=never

# ---- MySQL (override with environment variables) ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/resq_campus?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Tables are created/updated automatically from the JPA entities.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.jackson.serialization.write-dates-as-timestamps=false

# ---- File uploads ----
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
resq.upload-dir=${UPLOAD_DIR:uploads}

# ---- Security ----
# CHANGE THIS in any real deployment (must be at least 32 characters).
resq.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-please-0123456789abcdef}
resq.jwt.expiration-hours=12
resq.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# ---- Demo data (marked demo=true so it stays separate from real records) ----
resq.seed.enabled=${SEED_DEMO_DATA:true}

# Time zone used for "today" statistics
resq.zone=${APP_ZONE:Asia/Kolkata}

# ---- Optional first administrator for real deployments (leave empty to skip) ----
resq.bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
resq.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
